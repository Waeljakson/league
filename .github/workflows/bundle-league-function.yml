name: Bundle League Neon Function
permissions:
  contents: write
on:
  push:
    paths:
      - 'functions/leagueapi/**'
      - '.github/workflows/bundle-league-function.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bundler and runtime dependencies
        run: npm install --no-save esbuild@0.25.10 hono@4.9.0 @neondatabase/serverless@1.0.1
      - name: Bundle function
        run: |
          rm -rf function-dist league-function.zip
          mkdir -p function-dist
          npx esbuild functions/leagueapi/index.js --bundle --platform=node --format=esm --target=node24 --banner:js='import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' --outfile=function-dist/index.js
          printf '{"type":"module"}\n' > function-dist/package.json
          cd function-dist
          zip -q ../league-function.zip index.js package.json
      - uses: actions/upload-artifact@v4
        with:
          name: league-function
          path: league-function.zip
          retention-days: 1
      - name: Publish deployment bundle
        run: |
          mkdir -p build
          base64 -w0 league-function.zip > build/league-function.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/league-function.b64
          git commit -m "Update bundled Neon function" || exit 0
          git push
